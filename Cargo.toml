[package]
name = "toml-rs"
version = "0.4.1"
edition = "2024"
license = "Unlicense"
repository = "https://github.com/lava-sh/toml-rs"
build = "build.rs"

[lib]
name = "_toml_rs"
crate-type = ["cdylib"]

[build-dependencies]
pyo3-build-config = "=0.29.1"

[dependencies]
pyo3 = {
    version = "=0.29.2",
    features = ["num-bigint"],
}
num-bigint = "=0.4.8"
memchr = "=2.8.3"
rustc-hash = "=2.1.3"
smallvec = "=2.0.0-alpha.12"
bytecount = {
    version = "=0.6.9",
    features = ["runtime-dispatch-simd"],
}
lexical-core = {
    git = "https://github.com/Alexhuszagh/rust-lexical",
    rev = "afb2efa651f42f63415a3bf3d51ced6143132b2b",
    default-features = false,
    features = [
        "radix",
        "parse-floats",
        "parse-integers",
    ],
}
###########################################################
#                   TOML v1.0.0 support                   #
# https://github.com/lava-sh/toml/tree/for_python_toml_rs #
###########################################################
toml_v1 = {
    git = "https://github.com/lava-sh/toml",
    rev = "b1581597f0fc10c0cc61faa03a3668b8f49e23f3",
    features = [
        "fast_hash", # uses `foldhash`
        "unbounded", # disables default recursion limit
        "preserve_order", # save order
    ],
}
toml_parser_v1 = {
    git = "https://github.com/lava-sh/toml",
    rev = "b1581597f0fc10c0cc61faa03a3668b8f49e23f3",
    features = [
        "std",
        "simd",
        "unsafe",
    ],
}
toml_edit_v1 = {
    git = "https://github.com/lava-sh/toml",
    rev = "b1581597f0fc10c0cc61faa03a3668b8f49e23f3",
    features = [
        "serde",
        "unbounded",
    ],
}
##############################################################
#                    TOML v1.1.0 support                     #
# https://github.com/lava-sh/toml/tree/python_toml_rs_v1.1.0 #
##############################################################
toml = {
    git = "https://github.com/lava-sh/toml",
    rev = "508504d54d4b23a672857b357d94f979707c772a",
    features = [
        "fast_hash", # uses `foldhash`
        "unbounded", # disables default recursion limit
        "preserve_order", # save order
    ]
}
toml_parser = {
    git = "https://github.com/lava-sh/toml",
    rev = "508504d54d4b23a672857b357d94f979707c772a",
    features = [
        "std",
        "simd",
        "unsafe",
    ]
}
toml_edit = {
    git = "https://github.com/lava-sh/toml",
    rev = "508504d54d4b23a672857b357d94f979707c772a",
    features = [
        "serde",
        "unbounded",
    ]
}

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
mimalloc = {
    optional = true,
    version = "=0.1.52",
    features = [
        "override",
        "local_dynamic_tls",
    ]
}

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = {
    optional = true,
    version = "=0.1.52",
    # See: https://github.com/lava-sh/toml-rs/issues/229
    #
    # mimalloc "override" feature installs process-wide malloc interposition and
    # replaces macOS malloc zone/fork hooks when the extension is imported via dlopen.
    # That breaks fork-based subprocess spawning, e.g., asyncio/playwright can fail.
    features = [
        "local_dynamic_tls",
    ]
}

[target.'cfg(target_os = "windows")'.dependencies]
mimalloc = {
    optional = true,
    version = "=0.1.52",
    features = [],
}

[features]
default = []
mimalloc = ["dep:mimalloc"]
android = ["pyo3/abi3-py310"]
ios = ["pyo3/abi3-py310"]

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"
strip = "symbols"
codegen-units = 1

[lints.rust]
warnings = "deny"

[lints.clippy]
perf       = { level = "deny", priority = 1 }
style      = { level = "deny", priority = -1 }
pedantic   = { level = "deny", priority = -1 }
nursery    = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

allow_attributes = "deny"

similar_names = "allow"
too_many_lines = "allow"
manual_let_else = "allow"
cast_possible_truncation = "allow"
missing_const_for_fn = "allow"
