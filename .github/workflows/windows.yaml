name: "Windows"

on:
  workflow_call:

env:
  UV_LINK_MODE: copy
  #
  __interpreters_without_pypy: &interpreters_without_pypy "3.11 3.12 3.13 3.14 3.14t 3.15 3.15t"
  __interpreters:              &interpreters              "3.11 3.12 3.13 3.14 3.14t 3.15 3.15t pypy3.11"
  #
  __is_pull_request: &is_pull_request ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: "${{ matrix.platform.runner }} / ${{ matrix.platform.target }}"
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # See: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        platform:
          - {
            # AMD64
            runner: windows-latest,
            target: x86_64-pc-windows-msvc,
            interpreter: *interpreters,
            python-arch: x86_64,
            maturin-build-args: "--features mimalloc --pgo",
          }
          - {
            # x86 (32-bit)
            runner: windows-latest,
            target: i686-pc-windows-msvc,
            interpreter: *interpreters_without_pypy,
            python-arch: x86,
            maturin-build-args: "--features mimalloc --pgo",
          }
          - {
            # ARM64
            runner: windows-11-vs2026-arm,
            target: aarch64-pc-windows-msvc,
            interpreter: *interpreters_without_pypy,
            python-arch: aarch64,
            maturin-build-args: "--features mimalloc",
          }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        if: *is_pull_request
        with:
          version: "v2.0.0-rc.3"
          pr-comment: false
          github-cache: true
          cache-executables: true
          cache-dir: ${{ runner.temp }}/kache
          cache-key-prefix: kache-${{ matrix.platform.target }}

      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: *is_pull_request

      - name: "Install Python interpreters"
        id: interpreters
        shell: bash
        env:
          PYTHON_VERSIONS: ${{ matrix.platform.interpreter }}
          UV_PYTHON_ARCH: ${{ matrix.platform.python-arch }}
        run: bash .github/scripts/install-python.sh

      - name: "Build wheels"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          KACHE_LOG: "kache::path_normalizer=off"
        with:
          container: off
          target: ${{ matrix.platform.target }}
          args: >-
            --release
            --out dist
            --interpreter ${{ steps.interpreters.outputs.paths }}
            ${{ matrix.platform.maturin-build-args || '' }}
            --compatibility pypi

      - name: "kache stats"
        if: *is_pull_request
        run: kache stats --full

      - name: "Upload wheels"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
