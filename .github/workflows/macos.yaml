name: "macOS"

on:
  workflow_call:

env:
  ○_○: &interpreters "3.11 3.12 3.13 3.14 3.14t 3.15 3.15t pypy3.11"
  #
  (^_^): &is_pull_request ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: "${{ matrix.platform.runner }} / ${{ matrix.platform.target }}"
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # See: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        platform:
          - {
            # Intel Mac
            runner: macos-26-intel,
            target: x86_64-apple-darwin,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc",
            use-pgo: true,
          }
          - {
            # Apple Silicon M1-M4
            runner: macos-latest,
            target: aarch64-apple-darwin,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc",
            use-pgo: true,
          }
          - {
            # Universal binary (Intel + Apple Silicon)
            runner: macos-latest,
            target: universal2-apple-darwin,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc",
          }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: *is_pull_request

      - name: "Build wheels"
        if: matrix.platform.use-pgo != true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          sccache: *is_pull_request
          args: >-
            --release
            --out wheels
            --interpreter ${{ matrix.platform.interpreter }}
            ${{ matrix.platform.maturin-build-args || '' }}
            --compatibility pypi

      - name: "Install Rust stable + llvm-tools-preview"
        if: matrix.platform.use-pgo == true
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses]
        with:
          components: llvm-tools-preview

      - name: "Build PGO wheel"
        if: matrix.platform.use-pgo == true
        uses: lava-sh/build-pgo-wheel@main # zizmor: ignore[unpinned-uses]
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: ${{ steps.rust-toolchain.outputs.name }}
          maturin-build-args: ${{ matrix.platform.maturin-build-args || '' }}
          python-interpreter: ${{ matrix.platform.interpreter }}
          pgo-training-command: "{python} benchmark/pgo.py"

      - name: "Test wheels"
        shell: bash
        run: |
          interpreters="${{ matrix.platform.interpreter }}"
          
          for py_version in $interpreters; do
            uv venv .venv --python "$py_version"
            uv pip install --group nox
          
            if [[ "$py_version" == pypy* ]]; then
              wheel_tag="pp${py_version#pypy}"
            elif [[ "$py_version" == *t ]]; then
              wheel_tag="cp${py_version%t//./}t"
            else
              wheel_tag="cp${py_version//./}"
            fi

            wheel=$(find wheels -maxdepth 1 -type f -name "*${wheel_tag}*.whl" | head -n 1)
          
            uv pip install "$wheel"
            nox --parallel 4
          
            rm -rf .venv
          done

      - name: "Upload wheels"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: wheels
