name: "manylinux"

on:
  workflow_call:

env:
  __interpreters: &interpreters "3.11 3.12 3.13 3.14 3.14t 3.15 3.15t pypy3.11"
  #
  __is_pull_request: &is_pull_request ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: "${{ matrix.platform.runner }} / ${{ matrix.platform.target }}"
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Rust target `loongarch64-unknown-linux-gnu` is not supported by PyPI
        #
        # See: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        platform:
          - {
            # AMD64
            runner: ubuntu-26.04,
            target: x86_64-unknown-linux-gnu,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc --pgo",
          }
          - {
            # x86 (32-bit)
            runner: ubuntu-26.04,
            target: i686-unknown-linux-gnu,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc --zig",
          }
          - {
            # ARM64
            runner: ubuntu-26.04-arm,
            target: aarch64-unknown-linux-gnu,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc --pgo",
          }
          - {
            # ARMv7 (32-bit)
            runner: ubuntu-26.04,
            target: armv7-unknown-linux-gnueabihf,
            interpreter: *interpreters,
          }
          - {
            # IBM System z (s390x)
            runner: ubuntu-26.04,
            target: s390x-unknown-linux-gnu,
            interpreter: *interpreters,
          }
          - {
            # PowerPC64 Little Endian
            runner: ubuntu-26.04,
            target: powerpc64le-unknown-linux-gnu,
            interpreter: *interpreters,
          }
          - {
            # PowerPC64 Big Endian
            runner: ubuntu-26.04,
            target: powerpc64-unknown-linux-gnu,
            interpreter: *interpreters,
          }
          - {
            # RISC-V 64-bit
            runner: ubuntu-26.04,
            target: riscv64gc-unknown-linux-gnu,
            interpreter: *interpreters,
            maturin-build-args: "--features mimalloc",
          }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: *is_pull_request

      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        if: *is_pull_request
        with:
          version: "v2.0.0-rc.3"
          pr-comment: false
          github-cache: true
          cache-executables: true
          cache-dir: ${{ github.workspace }}/.kache-store
          cache-key-prefix: kache-${{ matrix.platform.target }}

      - name: "Configure Docker options"
        env:
          IS_PULL_REQUEST: *is_pull_request
        run: |
          options=(-e CI)
          if [ "$IS_PULL_REQUEST" = "true" ]; then
            options+=(
              -e RUSTC_WRAPPER=/kache-bin/kache
              -e "KACHE_CACHE_DIR=$GITHUB_WORKSPACE/.kache-store"
              -e "KACHE_RUNTIME_DIR=/kache-run"
              -e KACHE_CACHE_EXECUTABLES
              -e KACHE_LOG
              -v "$(dirname "$(command -v kache)"):/kache-bin:ro"
              -v "$KACHE_RUNTIME_DIR:/kache-run"
            )
          fi
          printf 'DOCKER_OPTIONS=%s\n' "${options[*]}" >> "$GITHUB_ENV"

      - name: "Build wheels"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: auto
          docker-options: ${{ env.DOCKER_OPTIONS }}
          args: >-
            --release
            --out dist
            --interpreter ${{ matrix.platform.interpreter }}
            ${{ matrix.platform.maturin-build-args || '' }}
            --compatibility pypi

      - name: "Fix store ownership"
        if: always() && github.event_name == 'pull_request'
        run: |
          owner="$(id -u):$(id -g)"
          for dir in "$GITHUB_WORKSPACE/.kache-store" "$KACHE_RUNTIME_DIR"; do
            if [ -d "$dir" ]; then
              sudo chown -R "$owner" "$dir"
            fi
          done

      - name: "kache stats"
        if: always() && github.event_name == 'pull_request'
        run: kache stats --full || true

      - name: "Upload wheels"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
