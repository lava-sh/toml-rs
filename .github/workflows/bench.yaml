name: "bench"

permissions: {}

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: "${{ matrix.platform.name }} / Python ${{ matrix.python-version }} / ${{ matrix.allocator }}"
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.14t"]

        allocator: [default, mimalloc, snmalloc, jemalloc]

        platform:
          - {
              name: "macOS Intel",
              runner: "macos-26-intel",
              target: "x86_64-apple-darwin",
            }
          - {
              name: "macOS ARM",
              runner: "macos-latest",
              target: "aarch64-apple-darwin",
            }
          - {
              name: "Linux ARM musl",
              runner: "ubuntu-26.04-arm",
              target: "aarch64-unknown-linux-musl",
            }
          - {
              name: "Linux x86_64 musl",
              runner: "ubuntu-latest",
              target: "x86_64-unknown-linux-musl",
            }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          enable-cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: github.event_name == 'pull_request' && github.run_attempt == 1
        with:
          lookup-only: false
          shared-key: ${{ matrix.platform.target }}-${{ matrix.python-version }}-${{ matrix.allocator }}

      - name: "Create virtual environment"
        shell: bash
        run: |
          set -euo pipefail

          uv venv \
            ".venv-${{ matrix.python-version }}-${{ matrix.allocator }}" \
            --python "${{ matrix.python-version }}"

      - name: "Build wheel"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ runner.os == 'Linux' && 'musllinux_1_2' || '' }}
          sccache: false
          args: >-
            --release
            --out dist
            --interpreter
            ${{ runner.os == 'Linux'
              && format('$PWD/.venv-{0}-{1}/bin/python{0}', matrix.python-version, matrix.allocator)
              || format('$PWD/.venv-{0}-{1}/bin/python', matrix.python-version, matrix.allocator) }}
            ${{ matrix.allocator != 'default' && format('--features {0}', matrix.allocator) || '' }}
            --compatibility pypi

      - name: "Install wheel"
        shell: bash
        run: |
          set -euo pipefail

          PYTHON="$PWD/.venv-${{ matrix.python-version }}-${{ matrix.allocator }}/bin/python"

          uv pip install \
            --python "$PYTHON" \
            dist/*.whl

          "$PYTHON" -c "import toml_rs"

      - name: "Run benchmark"
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          ALLOCATOR: ${{ matrix.allocator }}
        run: |
          set -euo pipefail

          PYTHON="$PWD/.venv-${{ matrix.python-version }}-${{ matrix.allocator }}/bin/python"

          "$PYTHON" bench.py