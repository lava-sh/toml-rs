name: "bench"

permissions: {}

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: "${{ matrix.platform.name }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.14t"]

        platform:
          - {
              name: "macOS Intel",
              runner: "macos-26-intel",
              target: "x86_64-apple-darwin",
            }
          - {
              name: "macOS ARM",
              runner: "macos-latest",
              target: "aarch64-apple-darwin",
            }
          - {
              name: "Linux ARM musl",
              runner: "ubuntu-26.04-arm",
              target: "aarch64-unknown-linux-musl",
            }
          - {
              name: "Linux x86_64 musl",
              runner: "ubuntu-latest",
              target: "x86_64-unknown-linux-musl",
            }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name == 'pull_request' && github.run_attempt == 1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning]
          shared-key: ${{ matrix.platform.target }}-${{ matrix.python-version }}

      - name: "Install maturin"
        run: uv tool install maturin

      - name: "Create virtual environments"
        shell: bash
        run: |
          set -euo pipefail

          for allocator in default mimalloc snmalloc jemalloc; do
            VENV=".venv-${{ matrix.python-version }}-$allocator"

            echo
            echo "========================================"
            echo "Creating: $VENV"
            echo "========================================"

            uv venv "$VENV" --python "${{ matrix.python-version }}"

            PYTHON="$PWD/$VENV/bin/python"

            "$PYTHON" --version
            "$PYTHON" -c 'import sys; print(sys.executable)'
          done

      # ------------------------------------------------------------
      # macOS
      # ------------------------------------------------------------

      - name: "Build macOS wheels"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p wheel

          for allocator in default mimalloc snmalloc jemalloc; do
            VENV="$PWD/.venv-${{ matrix.python-version }}-$allocator"
            PYTHON="$VENV/bin/python"

            case "$allocator" in
              default)
                echo
                echo "========================================"
                echo "Allocator : default"
                echo "Python    : $PYTHON"
                echo "Target    : ${{ matrix.platform.target }}"
                echo "Features  : default"
                echo "========================================"

                maturin build \
                  --release \
                  --target "${{ matrix.platform.target }}" \
                  --interpreter "$PYTHON" \
                  --out "wheel/$allocator"
                ;;

              mimalloc)
                echo
                echo "========================================"
                echo "Allocator : mimalloc"
                echo "Python    : $PYTHON"
                echo "Target    : ${{ matrix.platform.target }}"
                echo "Features  : mimalloc"
                echo "========================================"

                maturin build \
                  --release \
                  --target "${{ matrix.platform.target }}" \
                  --interpreter "$PYTHON" \
                  --features mimalloc \
                  --out "wheel/$allocator"
                ;;

              snmalloc)
                echo
                echo "========================================"
                echo "Allocator : snmalloc"
                echo "Python    : $PYTHON"
                echo "Target    : ${{ matrix.platform.target }}"
                echo "Features  : snmalloc"
                echo "========================================"

                maturin build \
                  --release \
                  --target "${{ matrix.platform.target }}" \
                  --interpreter "$PYTHON" \
                  --features snmalloc \
                  --out "wheel/$allocator"
                ;;

              jemalloc)
                echo
                echo "========================================"
                echo "Allocator : jemalloc"
                echo "Python    : $PYTHON"
                echo "Target    : ${{ matrix.platform.target }}"
                echo "Features  : jemalloc"
                echo "========================================"

                maturin build \
                  --release \
                  --target "${{ matrix.platform.target }}" \
                  --interpreter "$PYTHON" \
                  --features jemalloc \
                  --out "wheel/$allocator"
                ;;
            esac
          done

      # ------------------------------------------------------------
      # Linux musl
      # ------------------------------------------------------------

      - name: "Configure Python for Linux musl"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          echo "PYO3_CROSS_PYTHON_VERSION=${{ matrix.python-version }}" >> "$GITHUB_ENV"

      - name: "Build Linux musl wheels"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p wheel

          for allocator in default mimalloc snmalloc jemalloc; do
            VENV="$PWD/.venv-${{ matrix.python-version }}-$allocator"
            PYTHON="$VENV/bin/python"

            echo
            echo "========================================"
            echo "Allocator : $allocator"
            echo "Python    : $PYTHON"
            echo "Target    : ${{ matrix.platform.target }}"
            echo "========================================"

            "$PYTHON" --version

            case "$allocator" in
              default)
                maturin build \
                  --release \
                  --target "${{ matrix.platform.target }}" \
                  --out "wheel/$allocator"
                ;;

              mimalloc)
                maturin build \
                  --release \
                  --target "${{ matrix.platform.target }}" \
                  --features mimalloc \
                  --out "wheel/$allocator"
                ;;

              snmalloc)
                maturin build \
                  --release \
                  --target "${{ matrix.platform.target }}" \
                  --features snmalloc \
                  --out "wheel/$allocator"
                ;;

              jemalloc)
                maturin build \
                  --release \
                  --target "${{ matrix.platform.target }}" \
                  --features jemalloc \
                  --out "wheel/$allocator"
                ;;
            esac
          done

      # ------------------------------------------------------------
      # Verify wheels
      # ------------------------------------------------------------

      - name: "Show built wheels"
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "================ BUILT WHEELS ================"

          find wheel \
            -type f \
            -name "*.whl" \
            -print \
            | sort

          echo
          echo "================ WHEEL TAGS =================="

          for wheel in wheel/*/*.whl; do
            echo "$wheel"
          done

          echo "==============================================="

      # ------------------------------------------------------------
      # Install
      # ------------------------------------------------------------

      - name: "Install wheels"
        shell: bash
        run: |
          set -euo pipefail

          for allocator in default mimalloc snmalloc jemalloc; do
            VENV="$PWD/.venv-${{ matrix.python-version }}-$allocator"
            PYTHON="$VENV/bin/python"

            echo
            echo "========================================"
            echo "Installing : $allocator"
            echo "Python     : $PYTHON"
            echo "========================================"

            uv pip install \
              --python "$PYTHON" \
              wheel/"$allocator"/*.whl

            "$PYTHON" -c '
            import sys
            import toml_rs

            print("Python:", sys.version)
            print("Executable:", sys.executable)
            print("toml_rs:", toml_rs.__file__)
            '

            "$PYTHON" -c '
            import toml_rs

            assert toml_rs.loads("foo = 42")["foo"] == 42

            print("Import test: OK")
            '
          done

      # ------------------------------------------------------------
      # Benchmark
      # ------------------------------------------------------------

      - name: "Run benchmark"
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=============================================="
          echo "RUNNING BENCHMARK"
          echo "=============================================="

          for allocator in default mimalloc snmalloc jemalloc; do
            VENV="$PWD/.venv-${{ matrix.python-version }}-$allocator"
            PYTHON="$VENV/bin/python"

            echo
            echo "========================================"
            echo "BENCHMARK : $allocator"
            echo "Python    : $PYTHON"
            echo "========================================"

            "$PYTHON" --version

            "$PYTHON" bench.py
          done