name: "bench"

permissions: {}

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: "${{ matrix.platform.name }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"
          - "3.14t"

        platform:
          - {
              name: "macOS Intel",
              runner: "macos-26-intel",
              target: "x86_64-apple-darwin",
            }
          - {
              name: "macOS ARM",
              runner: "macos-latest",
              target: "aarch64-apple-darwin",
            }
          - {
              name: "Linux ARM musl",
              runner: "ubuntu-26.04-arm",
              target: "aarch64-unknown-linux-musl",
            }
          - {
              name: "Linux x86_64 musl",
              runner: "ubuntu-latest",
              target: "x86_64-unknown-linux-musl",
            }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: github.event_name == 'pull_request' && github.run_attempt == 1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning]
          shared-key: ${{ matrix.platform.target }}-${{ matrix.python-version }}

      - name: "Install maturin"
        run: uv tool install maturin

      - name: "Install Rust target"
        if: runner.os == 'Linux'
        run: rustup target add "${{ matrix.platform.target }}"

      - name: "Install Zig"
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2 # zizmor: ignore[unpinned-uses]
        with:
          version: 0.17.0-dev.1756+613c03321

      - name: "Check Zig"
        if: runner.os == 'Linux'
        run: zig version

      - name: "Create virtual environments"
        shell: bash
        run: |
          set -euo pipefail

          for allocator in default mimalloc snmalloc jemalloc; do
            uv venv \
              ".venv-${{ matrix.python-version }}-$allocator" \
              --python "${{ matrix.python-version }}"
          done

      - name: "Build wheels on macOS"
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          for allocator in default mimalloc snmalloc jemalloc; do
            VENV="$PWD/.venv-${{ matrix.python-version }}-$allocator"
            PYTHON="$VENV/bin/python"

            if [[ "$allocator" == "default" ]]; then
              maturin build \
                --release \
                --target "${{ matrix.platform.target }}" \
                --interpreter "$PYTHON" \
                --out "wheel/$allocator"
            else
              maturin build \
                --release \
                --target "${{ matrix.platform.target }}" \
                --interpreter "$PYTHON" \
                --out "wheel/$allocator" \
                --features "$allocator"
            fi
          done

      - name: "Build wheels on Linux"
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ matrix.python-version }}" == "3.14t" ]]; then
            PYTHON_NAME="python3.14t"
          else
            PYTHON_NAME="python3.14"
          fi

          for allocator in default mimalloc snmalloc jemalloc; do
            VENV="$PWD/.venv-${{ matrix.python-version }}-$allocator"
            PYTHON="$VENV/bin/$PYTHON_NAME"

            if [[ "$allocator" == "default" ]]; then
              maturin build \
                --release \
                --target "${{ matrix.platform.target }}" \
                --interpreter "$PYTHON" \
                --out "wheel/$allocator"
            else
              maturin build \
                --release \
                --target "${{ matrix.platform.target }}" \
                --interpreter "$PYTHON" \
                --out "wheel/$allocator" \
                --features "$allocator" \
                --zig
            fi
          done

      - name: "Install wheels"
        shell: bash
        run: |
          set -euo pipefail

          for allocator in default mimalloc snmalloc jemalloc; do
            PYTHON="$PWD/.venv-${{ matrix.python-version }}-$allocator/bin/python"

            uv pip install \
              --python "$PYTHON" \
              wheel/"$allocator"/*.whl

            "$PYTHON" -c "import toml_rs"
          done

      - name: "Run benchmark"
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -euo pipefail

          for allocator in default mimalloc snmalloc jemalloc; do
            PYTHON="$PWD/.venv-${{ matrix.python-version }}-$allocator/bin/python"
            "$PYTHON" bench.py
          done