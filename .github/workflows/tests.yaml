name: "tests"

on:
  workflow_call:

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always
  #
  __is_pull_request: &is_pull_request ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: "${{ matrix.os }} / python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [
          "3.11",
          "3.12",
          "3.13",
          "3.14", "3.14t",
          "3.15", "3.15t",
          "pypy3.11",
        ]
        runner: [
          "ubuntu-26.04",
          "windows-2025",
        ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: *is_pull_request

      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        if: *is_pull_request
        with:
          pr-comment: false
          github-cache: true
          cache-executables: true
          cache-dir: ${{ runner.temp }}/kache
          cache-key-prefix: kache-${{ matrix.runner }}-${{ matrix.python-version }}

      - name: "Create and activate .venv"
        shell: bash
        run: |
          uv venv .venv --python ${{ matrix.python-version }}
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo ".venv/Scripts" >> "$GITHUB_PATH"
            echo "PYO3_PYTHON=.venv/Scripts/python" >> "$GITHUB_ENV"
            echo "UV_LINK_MODE=copy" >> "$GITHUB_ENV"
          else
            echo ".venv/bin" >> "$GITHUB_PATH"
            echo "PYO3_PYTHON=.venv/bin/python3" >> "$GITHUB_ENV"
          fi

      - name: "Install dependencies"
        run: uv pip install --group ci

      - name: "Run maturin"
        run: maturin build --out wheels --features mimalloc

      - name: "kache stats"
        if: *is_pull_request
        run: kache stats --full

      - name: "Install built wheel"
        run: uv pip install toml-rs --no-index --find-links wheels --force-reinstall

      - name: "Run ruff"
        run: ruff check

      - name: "Run ty"
        run: ty check

      - name: "Run nox"
        run: nox --parallel 4
