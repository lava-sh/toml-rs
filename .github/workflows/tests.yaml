name: "tests"

on:
  workflow_call:

env:
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: "ubuntu-latest / python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [
          "3.11",
          "3.15",
        ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name == 'pull_request' && github.run_attempt == 1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning]
          shared-key: ${{ matrix.os }}-${{ matrix.python-version }}

      - name: "Create and activate .venv"
        shell: bash
        run: |
          uv venv .venv --python ${{ matrix.python-version }}
          echo ".venv/bin" >> "$GITHUB_PATH"
          echo "PYO3_PYTHON=.venv/bin/python3" >> "$GITHUB_ENV"

      - name: "Install dependencies"
        run: uv pip install --group ci

      - name: "Run maturin"
        run: maturin build --out wheel --features mimalloc

      - name: "Install built wheel"
        shell: bash
        run: uv pip install wheel/*.whl

      - name: "Run ruff"
        run: ruff check

      - name: "Run ty"
        run: ty check
